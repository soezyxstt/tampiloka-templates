name: School implementation workspace
on:
  push:
    branches: [feat/school-template]
    paths: [.github/workflows/school-workspace.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  workspace:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.2
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Baseline regression checks
        run: pnpm test:cli && pnpm test:registry && pnpm catalog:test && pnpm lint:design
      - name: Package private workspace for implementation
        run: |
          tar --exclude='./.git' --exclude='./.pnpm-store' --exclude='./.wrangler' --exclude='./.data' -czf /tmp/school-workspace.tar.gz .
      - uses: actions/upload-artifact@v4
        with:
          name: school-workspace
          path: /tmp/school-workspace.tar.gz
          retention-days: 1
