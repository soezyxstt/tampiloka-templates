name: Booking build environment
on:
  push:
    branches: [feat/booking-template]
    paths: ['.github/workflows/booking-build-environment.yml']
permissions:
  contents: read
jobs:
  checkpoint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Fetch public dependencies from isolated build sandbox
        run: |
          mkdir -p /tmp/booking-environment
          cd /tmp/booking-environment
          curl --fail --retry 2 --max-time 180 https://sb-7l1b78mfalcz.vercel.run/booking-public-deps-8d3b91.tar.gz -o dependencies.tar.gz
          curl --fail --retry 2 --max-time 120 https://sb-7l1b78mfalcz.vercel.run/booking-build-tools-8d3b91.tar.gz -o tools.tar.gz
          echo '6b555967d90328218106309974b37eee023488dbec6e516002cc960ae7421c89  dependencies.tar.gz' | sha256sum --check
          echo '9bbeea0756b08763bc3cc568d912fbb437eaac8256596086de691b8332645bca  tools.tar.gz' | sha256sum --check
      - uses: actions/upload-artifact@v4
        with:
          name: booking-build-environment
          path: /tmp/booking-environment
          retention-days: 1
          compression-level: 0
