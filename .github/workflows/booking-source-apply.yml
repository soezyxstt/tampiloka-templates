name: Booking source checkpoint and verification
on:
  push:
    branches: [feat/booking-template]
    paths: ['.github/workflows/booking-source-apply.yml']
permissions:
  contents: write
concurrency:
  group: booking-source-apply
  cancel-in-progress: false
jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/booking-template
      - name: Fetch checksum-pinned private source checkpoint
        env:
          SOURCE_URL: 'https://sdmntprseasia.oaiusercontent.com/files/00000000-dd78-8207-86b6-70c190ba41cc/raw?se=2026-10-31T00%3A36%3A39Z&sp=r&sv=2026-02-06&sr=b&scid=11cda025-c212-5dac-b5a2-90ed21520a44&skoid=5e5afa93-cb2e-42ad-a58a-830b5b446f03&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-10-30T23%3A27%3A33Z&ske=2026-10-31T23%3A27%3A33Z&sks=b&skv=2026-02-06&sig=bOy3DKqN%2B2mlGnUVX6rUk2BT5CBLWKV4Tob5PXKkinM%3D'
        run: |
          curl --fail --silent --show-error --max-time 90 "$SOURCE_URL" -o /tmp/booking-checkpoint.zip
          echo 'fc90c10d73ecc5108c2438fda26098cb304b75bf99916a2071d354a839fb6035  /tmp/booking-checkpoint.zip' | sha256sum --check
          python3 - <<'PY'
          import json,zipfile,pathlib,subprocess
          archive=zipfile.ZipFile('/tmp/booking-checkpoint.zip')
          data=json.loads(archive.read('changes.json'))
          pathlib.Path('/tmp/booking.patch').write_text(data['patch'])
          subprocess.run(['git','apply','--check','/tmp/booking.patch'],check=True)
          subprocess.run(['git','apply','/tmp/booking.patch'],check=True)
          for name,content in data['files'].items():
              path=pathlib.PurePosixPath(name)
              assert '..' not in path.parts and not path.is_absolute()
              assert name.startswith('templates/booking/') or name=='packages/cli/tests/booking-standalone.mjs'
              target=pathlib.Path(name);target.parent.mkdir(parents=True,exist_ok=True);target.write_text(content)
          for name in archive.namelist():
              if name=='changes.json': continue
              assert name.startswith('templates/booking/public/images/') and '..' not in pathlib.PurePosixPath(name).parts and name.endswith('.webp')
              pathlib.Path(name).write_bytes(archive.read(name))
          PY
      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.2
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --no-frozen-lockfile
      - name: Format new template source
        run: pnpm dlx prettier@3.6.2 --write templates/booking packages/cli/tests/booking-standalone.mjs
      - name: Commit implemented template on feature branch only
        run: |
          test "$(git branch --show-current)" = 'feat/booking-template'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md docs package.json pnpm-lock.yaml packages/cli packages/registry packages/ui-core templates/booking
          git commit -m 'feat(booking): implement appointment workflows, staff CMS, payments, tickets and CLI generation'
          git push origin HEAD:refs/heads/feat/booking-template
      - name: Unit, registry, CLI and design checks
        run: |
          pnpm lint:design
          pnpm test:cli
          pnpm test:registry
          pnpm catalog:test
          pnpm --filter @tampiloka/template-booking typecheck
          pnpm --filter @tampiloka/template-booking test
          pnpm --filter @tampiloka/template-booking build
      - name: Browser verification against actual Worker and D1
        id: browser
        continue-on-error: true
        run: |
          pnpm --filter @tampiloka/template-booking exec playwright install --with-deps chromium
          pnpm --filter @tampiloka/template-booking test:e2e
      - name: Fresh independent client project verification
        id: standalone
        continue-on-error: true
        run: pnpm test:booking:standalone
      - name: Generate preview assets from actual browser captures
        if: always()
        run: |
          python3 -m pip install Pillow
          python3 - <<'PY'
          from pathlib import Path
          from PIL import Image
          root=Path('templates/booking');out=root/'public/demo-previews';out.mkdir(parents=True,exist_ok=True)
          for file in (root/'test-results/browser').glob('*-preview.png'):
              image=Image.open(file);assert image.size==(1280,800)
              image.save(out/(file.stem.replace('-preview','')+'.webp'),'WEBP',quality=85)
          PY
      - name: Checkpoint evidence
        if: always()
        run: |
          mkdir -p /tmp/booking-evidence
          git diff --binary > /tmp/booking-evidence/post-verification.patch
          git archive --format=tar.gz HEAD -o /tmp/booking-evidence/source.tar.gz
          cp -r templates/booking/test-results /tmp/booking-evidence/ 2>/dev/null || true
          cp -r templates/booking/public/demo-previews /tmp/booking-evidence/ 2>/dev/null || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: booking-implementation-evidence
          path: /tmp/booking-evidence
          retention-days: 7
      - name: Enforce completed verification
        if: always()
        env:
          BROWSER: ${{ steps.browser.outcome }}
          STANDALONE: ${{ steps.standalone.outcome }}
        run: test "$BROWSER" = success && test "$STANDALONE" = success
