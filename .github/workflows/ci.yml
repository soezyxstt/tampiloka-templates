name: Verify Tampiloka templates

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      live_layout:
        description: Check deployed cafe staff layouts
        type: boolean
        required: false
        default: false
      full_cafe:
        description: Run the complete Cafe demo browser suite
        type: boolean
        required: false
        default: false

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  verify:
    if: github.event_name != 'workflow_dispatch' || inputs.live_layout != true
    # The locked Playwright release supports this image; ubuntu-latest can advance independently.
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.2
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: pnpm
      - name: Install locked workspace
        run: pnpm install --frozen-lockfile
      - name: Test registry and standalone client generation
        run: pnpm test:docs && pnpm test:registry && pnpm test:cli && pnpm --filter @tampiloka/shared-utils test && node --test scripts/cutover-turso.test.mjs
      - name: Test cafe transactions, runtime and operations regressions
        run: pnpm --filter @tampiloka/template-cafe test && pnpm --filter @tampiloka/template-cafe test:demo-runtime && pnpm test:operations
      - name: Test commerce permissions, pricing, stock and payments
        run: pnpm --filter @tampiloka/template-commerce test
      - name: Test shared storage and PostgreSQL provider flows
        run: node --experimental-strip-types --test --test-concurrency=1 packages/storage/index.test.mjs templates/booking/tests/postgresql.integration.mjs templates/commerce/tests/postgresql.test.mjs
      - name: Check types
        run: pnpm typecheck
      - name: Lint cafe
        run: pnpm --filter @tampiloka/template-cafe lint
      - name: Check design tokens
        run: pnpm lint:design
      - name: Build templates
        run: pnpm build && pnpm build:cafe
      - name: Install Chromium
        run: pnpm --filter @tampiloka/template-commerce exec playwright install --with-deps chromium
      - name: Verify commerce customer and staff flow
        run: |
          DEMO_MODE=true pnpm --filter @tampiloka/template-commerce preview > /tmp/tampiloka-commerce-preview.log 2>&1 &
          COMMERCE_PREVIEW_PID=$!
          trap 'kill "$COMMERCE_PREVIEW_PID" 2>/dev/null || true' EXIT
          for COMMERCE_ATTEMPT in $(seq 1 40); do
            if curl --fail --silent http://127.0.0.1:4174/api/health > /dev/null; then break; fi
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:4174/api/health | node -e "let s=''; process.stdin.on('data', c => s += c).on('end', () => { if (JSON.parse(s).demo !== true) throw new Error('Commerce preview must run in demo mode'); });"
          pnpm --filter @tampiloka/template-commerce test:e2e
          pnpm --filter @tampiloka/template-commerce test:language
          pnpm --filter @tampiloka/template-commerce exec node tests/staff-browser.mjs
          pnpm --filter @tampiloka/template-commerce exec node tests/checkout-recovery.mjs
          pnpm --filter @tampiloka/template-commerce exec node tests/staff-pagination.mjs
      - name: Verify cafe motion, layout, presets and lifecycle
        if: github.event_name == 'workflow_dispatch' && inputs.full_cafe == true
        run: pnpm --filter @tampiloka/template-cafe test:demo-all
      - name: Keep verification evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: template-verification
          path: |
            templates/cafe/test-results/
            templates/commerce/test-results/
            test-results/
          if-no-files-found: ignore
          retention-days: 14

  live_layout:
    if: github.event_name == 'workflow_dispatch' && inputs.live_layout == true
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CAFE_DEMO_BASE_DOMAIN: tampiloka.site
      CAFE_LAYOUT_OUTPUT: test-results/staff-layout-live
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.2
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @tampiloka/template-cafe exec playwright install --with-deps chromium
      - name: Verify live layouts without server mutations
        working-directory: templates/cafe
        run: node --experimental-strip-types tests/demos-staff-layout.mjs
      - name: Keep evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: cafe-layout-live
          path: templates/cafe/test-results/
          if-no-files-found: ignore
          retention-days: 14

