name: Verify template

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set up Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Check types
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Test config, catalog, domain, and database commands
        run: npm test
      - name: Test browser demo adapters when included
        run: npm run test:demo-runtime --if-present
      - name: Build application
        run: npm run build
      - name: Build public demos when included
        run: npm run demos:build --if-present
      - name: Install Chromium for public demo acceptance tests
        if: hashFiles('demos/manifest.ts') != ''
        run: npx playwright install --with-deps chromium
      - name: Verify all presets and customer/staff lifecycle in the browser
        run: npm run test:demo-all --if-present
      - name: Keep browser verification evidence
        if: always() && hashFiles('test-results/**/*.json') != ''
        uses: actions/upload-artifact@v7
        with:
          name: cafe-browser-verification
          path: test-results/
          retention-days: 14
