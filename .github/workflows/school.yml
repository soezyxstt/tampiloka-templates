name: School quality gates
on:
  push:
    branches: [main, feat/school-template]
    paths:
      - 'templates/school/**'
      - 'packages/ui-core/**'
      - 'packages/shared-utils/**'
      - 'packages/storage/**'
      - 'packages/cli/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '.github/workflows/school.yml'
  pull_request:
    paths:
      - 'templates/school/**'
      - 'packages/ui-core/**'
      - 'packages/shared-utils/**'
      - 'packages/storage/**'
      - 'packages/cli/**'
      - 'packages/registry/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '.github/workflows/school.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: school-${{ github.head_ref || github.ref }}
  cancel-in-progress: true
jobs:
  school:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Archive the exact verification source
        run: |
          mkdir -p verification
          git rev-parse HEAD > verification/commit.txt
          git archive --format=tar HEAD templates/school packages scripts docs design-kit AGENTS.md README.md package.json pnpm-lock.yaml pnpm-workspace.yaml .github/workflows/school.yml | gzip > verification/school-source.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: school-verification-source
          path: verification
          retention-days: 14
      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.2
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Server, generator, registry and catalog tests
        run: pnpm test:school && pnpm test:cli && pnpm test:registry && pnpm catalog:test
      - name: Design, type safety and production build
        run: pnpm lint:design && pnpm --filter @tampiloka/template-school typecheck && pnpm build:school
      - name: Standalone client generation
        run: pnpm --filter @tampiloka/template-school test:standalone
      - name: Install Chromium
        working-directory: templates/school
        run: pnpm exec playwright install --with-deps chromium
      - name: Browser and visual checks
        run: pnpm test:school:browser && pnpm --filter @tampiloka/template-school exec node tests/institution-browser.mjs && pnpm --filter @tampiloka/template-school exec node tests/extension-browser.mjs
      - name: Branded institution client and built Worker routes
        working-directory: templates/school
        run: |
          set -euo pipefail
          fixture_dir="$(mktemp -d)"
          cleanup() {
            if [[ -n "${proxy_pid:-}" ]]; then kill "$proxy_pid" 2>/dev/null || true; wait "$proxy_pid" 2>/dev/null || true; fi
            docker logs school-libsql || true
            docker rm -f school-libsql || true
            rm -rf "$fixture_dir"
          }
          trap cleanup EXIT
          openssl req -x509 -newkey rsa:2048 -nodes -days 1 -keyout "$fixture_dir/key.pem" -out "$fixture_dir/cert.pem" -subj '/CN=127.0.0.1' -addext 'subjectAltName=IP:127.0.0.1' -addext 'basicConstraints=critical,CA:TRUE'
          docker run -d --name school-libsql -p 127.0.0.1:18080:8080 ghcr.io/tursodatabase/libsql-server:v0.24.32
          node tests/libsql-tls-proxy.mjs "$fixture_dir/key.pem" "$fixture_dir/cert.pem" &
          proxy_pid=$!
          cat /etc/ssl/certs/ca-certificates.crt "$fixture_dir/cert.pem" > "$fixture_dir/ca-bundle.pem"
          export NODE_EXTRA_CA_CERTS="$fixture_dir/cert.pem" SSL_CERT_FILE="$fixture_dir/ca-bundle.pem"
          export TURSO_DATABASE_URL=https://127.0.0.1:18443 TURSO_AUTH_TOKEN=fixture-only
          ready=false
          for attempt in $(seq 1 60); do
            if curl --silent --fail --cacert "$fixture_dir/cert.pem" -H 'Content-Type: application/json' -d '{"requests":[{"type":"execute","stmt":{"sql":"SELECT 1"}},{"type":"close"}]}' "$TURSO_DATABASE_URL/v2/pipeline" | grep -q '"ok"'; then ready=true; break; fi
            sleep 1
          done
          if [[ "$ready" != true ]]; then echo 'libSQL fixture failed readiness' >&2; exit 1; fi
          node tests/institution-client-browser.mjs
      - name: Package accurate demo previews
        run: |
          mkdir -p templates/school/dist/previews
          cp templates/school/test-results/school/*-preview.jpg templates/school/dist/previews/
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: school-visual-evidence
          path: templates/school/test-results
          if-no-files-found: ignore
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: school-build
          path: |
            templates/school/dist
            templates/school/dist-worker
          if-no-files-found: ignore
          retention-days: 14
