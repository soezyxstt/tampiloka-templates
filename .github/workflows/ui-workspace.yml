name: Prepare UI review workspace
on:
  push:
    branches: [feat/compact-ui-catalog-list]
    paths: [.github/workflows/ui-workspace.yml]
permissions:
  contents: read
jobs:
  workspace:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - run: |
          git archive --format=tar.gz HEAD > "$RUNNER_TEMP/cafe-ui-source.tar.gz"
          npm ci
          tar -czf "$RUNNER_TEMP/cafe-ui-deps.tar.gz" node_modules
      - uses: actions/upload-artifact@v7
        with:
          name: cafe-ui-review-workspace
          path: |
            ${{ runner.temp }}/cafe-ui-source.tar.gz
            ${{ runner.temp }}/cafe-ui-deps.tar.gz
          compression-level: 0
          retention-days: 1
