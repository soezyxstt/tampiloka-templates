name: Deploy changed Workers

on:
  push:
    branches: [main]
    paths:
      - 'templates/commerce/**'
      - 'packages/ui-core/**'
      - 'packages/theme-engine/**'
      - 'packages/shared-utils/**'
      - 'packages/registry/**'
      - 'packages/config/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '.github/workflows/deploy-workers.yml'
  pull_request:
    paths:
      - 'templates/commerce/**'
      - 'packages/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '.github/workflows/deploy-workers.yml'
  workflow_dispatch:
    inputs:
      target:
        description: Worker to deploy
        type: choice
        required: true
        options: [commerce, all]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: deploy-workers-production
  queue: max

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      commerce: ${{ steps.filter.outputs.commerce }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v3
        if: github.event_name != 'workflow_dispatch'
        id: filter
        with:
          base: ${{ github.event_name == 'push' && github.event.before || github.base_ref }}
          filters: |
            commerce:
              - '.github/workflows/deploy-workers.yml'
              - 'templates/commerce/**'
              - 'packages/{ui-core,theme-engine,shared-utils,config}/**'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
  deploy:
    needs: changes
    if: >-
      github.event_name != 'pull_request' && (github.event_name == 'workflow_dispatch' ||
      needs.changes.outputs.commerce == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          ref: main
      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.2
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: pnpm
      - name: Install locked workspace
        run: pnpm install --frozen-lockfile
      - name: Deploy commerce demo
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm --filter @tampiloka/template-commerce deploy:demo

  verify-build:
    if: github.event_name == 'pull_request'
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.2
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build commerce
        if: needs.changes.outputs.commerce == 'true'
        run: pnpm --filter @tampiloka/template-commerce build
