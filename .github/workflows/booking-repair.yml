name: Booking repair and complete verification
on:
  push:
    branches: [feat/booking-template]
    paths: ['.github/booking-repair.patch', '.github/workflows/booking-repair.yml']
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/booking-template
      - name: Apply reviewed repair and retire one-time workflow
        run: |
          test "$(git branch --show-current)" = feat/booking-template
          git apply --check .github/booking-repair.patch
          git apply .github/booking-repair.patch
          git rm .github/booking-repair.patch .github/workflows/booking-repair.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add packages/cli templates/booking/tests/browser.mjs
          git commit -m 'fix(booking): handle JSONC and enforce standalone client isolation after formatting'
          git push origin HEAD:refs/heads/feat/booking-template
      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.2
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Domain, CLI, registry and design verification
        id: unit
        continue-on-error: true
        run: |
          pnpm lint:design
          pnpm test:cli
          pnpm test:registry
          pnpm catalog:test
          pnpm --filter @tampiloka/template-booking typecheck
          pnpm --filter @tampiloka/template-booking test
          pnpm --filter @tampiloka/template-booking build
          pnpm --filter @tampiloka/template-commerce typecheck
      - name: Browser with actual Worker and D1
        id: browser
        continue-on-error: true
        run: |
          pnpm --filter @tampiloka/template-booking exec playwright install --with-deps chromium
          pnpm --filter @tampiloka/template-booking test:e2e
      - name: Fresh standalone client installation and runtime
        id: standalone
        continue-on-error: true
        run: node packages/cli/tests/booking-standalone.mjs
      - name: Preserve exact source and evidence
        if: always()
        run: |
          mkdir -p /tmp/booking-evidence
          git archive --format=tar.gz HEAD -o /tmp/booking-evidence/source.tar.gz
          cp -r templates/booking/test-results /tmp/booking-evidence/ 2>/dev/null || true
          cp -r templates/booking/dist /tmp/booking-evidence/ 2>/dev/null || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: booking-repair-evidence
          path: /tmp/booking-evidence
          retention-days: 7
      - name: Require all checks
        if: always()
        env:
          UNIT: ${{ steps.unit.outcome }}
          BROWSER: ${{ steps.browser.outcome }}
          STANDALONE: ${{ steps.standalone.outcome }}
        run: test "$UNIT" = success && test "$BROWSER" = success && test "$STANDALONE" = success
