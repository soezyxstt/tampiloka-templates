name: Booking validation

on:
  push:
    branches: [feat/booking-template]
  pull_request:
    paths:
      - 'templates/booking/**'
      - 'packages/cli/**'
      - 'packages/registry/**'
      - 'packages/ui-core/**'
      - '.github/workflows/booking-validation.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: booking-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Save tracked source checkpoint
        run: git archive --format=tar.gz HEAD -o /tmp/booking-source.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: booking-source
          path: /tmp/booking-source.tar.gz
          retention-days: 1
      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.2
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --no-frozen-lockfile
      - run: pnpm lint:design
      - run: pnpm test:cli
      - run: pnpm test:registry
      - run: pnpm catalog:test
      - name: Booking tests and build
        if: hashFiles('templates/booking/package.json') != ''
        run: |
          pnpm --filter @tampiloka/template-booking typecheck
          pnpm --filter @tampiloka/template-booking test
          pnpm --filter @tampiloka/template-booking build
      - name: Booking browser checks
        if: hashFiles('templates/booking/tests/browser.mjs') != ''
        run: |
          pnpm --filter @tampiloka/template-booking exec playwright install --with-deps chromium
          pnpm --filter @tampiloka/template-booking test:e2e
      - uses: actions/upload-artifact@v4
        if: always() && hashFiles('templates/booking/test-results/**') != ''
        with:
          name: booking-verification
          path: templates/booking/test-results
          retention-days: 7
