name: Apply and verify shared motion
on:
  push:
    branches: [fix/shared-motion-system]
    paths: [.github/workflows/apply-shared-motion.yml]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/shared-motion-system
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Apply scoped shared-component changes
        run: |
          node scripts/apply-shared-motion.mjs
          git add -A
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'feat: shared accessible motion for customer and staff UI'
          git push origin HEAD:fix/shared-motion-system
      - name: Types and lint
        run: npm run typecheck && npm run lint
      - name: Core and browser runtime tests
        if: '!cancelled()'
        run: npm test && npm run test:demo-runtime
      - name: Build application and showcase
        if: '!cancelled()'
        run: npm run build && npm run demos:build
      - name: Install browser
        if: '!cancelled()'
        run: npx playwright install --with-deps chromium
      - name: All browser suites, including normal and reduced motion
        if: '!cancelled()'
        run: npm run test:demo-all
      - name: Save verification evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: cafe-motion-evidence
          path: test-results/
          retention-days: 14
