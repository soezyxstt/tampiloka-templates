name: Apply compact UI changes
on:
  push:
    branches: [feat/compact-ui-catalog-list]
    paths: [.github/workflows/ui-apply.yml]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/compact-ui-catalog-list
          persist-credentials: true
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - run: |
          node scripts/apply-compact-ui.mjs
          git add -A
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'fix: constrain measured overflow sources and verify generated clients'
          git push origin HEAD:feat/compact-ui-catalog-list
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck && npm run lint && npm run demos:build
      - run: npx playwright install --with-deps chromium > "$RUNNER_TEMP/browser.log" 2>&1
      - name: All browser tests
        run: npm run test:demo-all
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: compact-ui-browser-evidence
          path: test-results/
          retention-days: 7
