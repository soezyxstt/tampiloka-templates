name: Apply compact UI changes
on:
  push:
    branches: [feat/compact-ui-catalog-list]
    paths: [.github/workflows/ui-apply.yml]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/compact-ui-catalog-list
          persist-credentials: true
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - name: Apply reviewed source transformations
        run: node scripts/apply-compact-ui.mjs
      - name: Publish source changes to the feature branch
        run: |
          git add -A
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'test: cover compact controls, payment notices and waiter catalog'
          git push origin HEAD:feat/compact-ui-catalog-list
      - run: npm ci --no-audit --no-fund
      - name: Types and lint
        run: npm run typecheck && npm run lint
      - name: Core tests
        if: always()
        run: |
          set +e
          npm test > "$RUNNER_TEMP/core.log" 2>&1
          result=$?
          tail -n 110 "$RUNNER_TEMP/core.log"
          exit "$result"
      - name: Build public demos
        if: always()
        run: npm run demos:build
      - name: Install browser
        if: always()
        run: npx playwright install --with-deps chromium > "$RUNNER_TEMP/browser-install.log" 2>&1
      - name: All browser gates
        if: always()
        run: npm run test:demo-all
      - name: Compact evidence summary
        if: always()
        run: |
          node --input-type=module <<'NODE'
          import { readFile } from 'node:fs/promises';
          for (const path of ['test-results/compact-ui/report.json','test-results/staff-layout/report.json','test-results/demos/demo-browser.json','test-results/lifecycle/lifecycle-browser.json']) {
            try { const r=JSON.parse(await readFile(path,'utf8'));console.log(path,JSON.stringify({checks:r.checks?.length,failures:r.failures,cases:r.cases?.map(c=>({id:c.id,status:c.status,error:c.error})),errors:r.errors,pageErrors:r.pageErrors,consoleErrors:r.consoleErrors})); } catch {}
          }
          NODE
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: compact-ui-browser-evidence
          path: test-results/
          retention-days: 7
