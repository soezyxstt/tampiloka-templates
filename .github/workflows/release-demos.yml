name: Release verified demos
on:
  push:
    branches: [main]
    paths:
      - 'templates/**'
      - 'packages/ui-core/**'
      - 'packages/theme-engine/**'
      - 'packages/shared-utils/**'
      - 'packages/config/**'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'package.json'
      - 'scripts/demo-release.mjs'
      - '.github/workflows/release-demos.yml'
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
jobs:
  release:
    if: github.repository == 'soezyxstt/tampiloka-templates' && github.ref == 'refs/heads/main'
    strategy:
      fail-fast: false
      matrix:
        family: [cafe, commerce, school, booking]
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    concurrency:
      group: catalog-and-demo-release
      queue: max
    env:
      NEXT_TELEMETRY_DISABLED: '1'
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.2
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Test the release source
        run: pnpm --filter @tampiloka/template-${{ matrix.family }} test && pnpm --filter @tampiloka/template-${{ matrix.family }} typecheck
      - name: Install Chromium
        run: pnpm --filter @tampiloka/template-${{ matrix.family }} exec playwright install --with-deps chromium
      - name: Build the exact deployment
        run: |
          case '${{ matrix.family }}' in
            cafe) pnpm build:cafe ;;
            booking) pnpm build:booking ;;
            *) pnpm build:${{ matrix.family }} ;;
          esac
      - name: Capture School previews before deployment
        if: matrix.family == 'school'
        run: |
          pnpm test:school:browser
          mkdir -p templates/school/dist/previews
          cp templates/school/test-results/school/*-preview.jpg templates/school/dist/previews/
      - name: Exercise Booking with local D1 before deployment
        if: matrix.family == 'booking'
        run: pnpm --filter @tampiloka/template-booking test:e2e
      - name: Set deployment paths
        run: |
          family='${{ matrix.family }}'
          directory="templates/$family/dist"
          origin="https://$family.tampiloka.site"
          if [ "$family" = cafe ]; then directory=templates/cafe/dist-demos; fi
          if [ "$family" = commerce ]; then origin=https://ecommerce.tampiloka.site; fi
          echo "RELEASE_DIRECTORY=$directory" >> "$GITHUB_ENV"
          echo "RELEASE_ORIGIN=$origin" >> "$GITHUB_ENV"
      - name: Stamp the built assets
        run: node scripts/demo-release.mjs stamp '${{ matrix.family }}' "$RELEASE_DIRECTORY"
      - name: Check the pre-provisioned School demo schema
        if: matrix.family == 'school'
        working-directory: templates/school
        run: node scripts/check-demo-schema.mjs
      - name: Check the pre-provisioned Booking demo schema
        if: matrix.family == 'booking'
        working-directory: templates/booking
        run: node scripts/check-demo-schema.mjs
      - name: Deploy the stamped build
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          cd templates/${{ matrix.family }}
          if [ '${{ matrix.family }}' = cafe ]; then
            pnpm exec wrangler pages deploy dist-demos --project-name tampiloka-cafe-demos --branch main
          else
            pnpm exec wrangler deploy --config wrangler.demo.jsonc
          fi
      - name: Check the actual hosted customer and staff flows
        env:
          CAFE_DEMO_BASE_URL: https://cafe.tampiloka.site
          CAFE_DEMO_BASE_DOMAIN: tampiloka.site
          COMMERCE_BASE_URL: https://ecommerce.tampiloka.site
          SCHOOL_URL: https://school.tampiloka.site
          SCHOOL_SCREENSHOTS: test-results/live-school
          BOOKING_TEST_URL: https://booking.tampiloka.site
        run: |
          case '${{ matrix.family }}' in
            cafe) pnpm --filter @tampiloka/template-cafe test:demo-browser && pnpm --filter @tampiloka/template-cafe test:demo-lifecycle ;;
            commerce) pnpm --filter @tampiloka/template-commerce test:e2e ;;
            school) (cd templates/school && node tests/live-smoke.mjs && pnpm test:e2e) ;;
            booking) BOOKING_CHECK_FILTER='^Full customer booking, failed attempt, retry, payment, receipt, QR image and staff check-in$' pnpm --filter @tampiloka/template-booking test:e2e ;;
          esac
      - name: Verify the hosted identity and exact preview bytes
        run: |
          node scripts/check-release-previews.mjs '${{ matrix.family }}' "$RELEASE_DIRECTORY"
          node scripts/demo-release.mjs verify '${{ matrix.family }}' "$RELEASE_DIRECTORY" "$RELEASE_ORIGIN"
      - uses: actions/upload-artifact@v7
        with:
          name: demo-release-${{ matrix.family }}
          path: demo-release-${{ matrix.family }}.json
          retention-days: 90
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: demo-checks-${{ matrix.family }}
          path: templates/${{ matrix.family }}/test-results/
          if-no-files-found: ignore
          retention-days: 14
