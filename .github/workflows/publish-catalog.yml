name: Publish public demo catalog

on:
  push:
    branches: [main]
    paths:
      - 'packages/registry/**'
      - 'scripts/*catalog*.mjs'
      - 'scripts/*release*.mjs'
      - '.github/workflows/publish-catalog.yml'
  pull_request:
    paths:
      - 'packages/registry/**'
      - 'scripts/*catalog*.mjs'
      - 'scripts/*release*.mjs'
      - '.github/workflows/publish-catalog.yml'
  workflow_dispatch:
  workflow_run:
    workflows: ['Release verified demos']
    types: [completed]
    branches: [main]

permissions:
  contents: read
  actions: read

concurrency:
  group: public-demo-catalog-${{ github.ref }}
  cancel-in-progress: false

jobs:
  catalog:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: catalog-and-demo-release
      queue: max
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          ref: ${{ github.event_name == 'pull_request' && github.sha || 'main' }}
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Validate publication boundaries and Worker response
        run: node --test packages/registry/tests/public-catalog.test.mjs packages/registry/tests/catalog-promotion.test.mjs packages/registry/tests/release-evidence.test.mjs
      - name: Build versioned public JSON and Worker
        run: |
          SOURCE_DATE_EPOCH=$(git show -s --format=%ct) node scripts/build-public-catalog.mjs
      - name: Verify hosted release evidence before promotion
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/verify-catalog-promotion.mjs
      - name: Verify hosted release evidence before promotion
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/verify-catalog-promotion.mjs
      - name: Keep the exact validated catalog
        uses: actions/upload-artifact@v7
        with:
          name: public-demo-catalog
          path: packages/registry/dist/catalog.v1.json
          retention-days: 14
      - name: Wait for published preview images
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          import { setTimeout as delay } from 'node:timers/promises';
          import { validatePublicCatalog } from './packages/registry/src/public-catalog.mjs';
          const catalog = validatePublicCatalog(JSON.parse(readFileSync('packages/registry/dist/catalog.v1.json', 'utf8')));
          const pending = new Set(catalog.entries.map(entry => entry.imageUrl));
          const total = pending.size;
          const lastErrors = new Map();
          const deadline = Date.now() + 180_000;
          let round = 0;
          while (pending.size && Date.now() < deadline) {
            round += 1;
            const queue = [...pending];
            let next = 0;
            async function checkImages() {
              while (next < queue.length && Date.now() < deadline) {
                const url = queue[next++];
                try {
                  const response = await fetch(url, {
                    method: 'HEAD', cache: 'no-store', redirect: 'error',
                    headers: { 'Cache-Control': 'no-cache' },
                    signal: AbortSignal.timeout(Math.max(1, Math.min(10_000, deadline - Date.now()))),
                  });
                  if (!response.ok) throw new Error(`HTTP ${response.status}`);
                  const type = (response.headers.get('content-type') ?? '').split(';')[0].trim().toLowerCase();
                  if (!type.startsWith('image/')) throw new Error(`Expected image content, received ${type || 'no Content-Type'}`);
                  pending.delete(url);
                  lastErrors.delete(url);
                } catch (error) {
                  lastErrors.set(url, String(error.message ?? error).slice(0, 160));
                }
              }
            }
            await Promise.all(Array.from({ length: Math.min(5, queue.length) }, () => checkImages()));
            console.log(`Preview images ready: ${total - pending.size}/${total}; attempt ${round}`);
            const remaining = deadline - Date.now();
            if (pending.size && remaining > 0) await delay(Math.min(5_000, remaining));
          }
          if (pending.size) {
            const details = [...pending].map(url => `${url}: ${lastErrors.get(url) ?? 'not checked before deadline'}`).join('\n');
            throw new Error(`Preview images are not ready after 180 seconds. Catalog publication stopped.\n${details}`);
          }
          NODE
      - name: Publish catalog independently of the marketing app
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npm exec --yes --package=wrangler@4.154.0 -- wrangler deploy --config packages/registry/wrangler.catalog.jsonc
      - name: Verify public feed
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          import { setTimeout as delay } from 'node:timers/promises';
          import assert from 'node:assert/strict';
          import { validatePublicCatalog } from './packages/registry/src/public-catalog.mjs';
          const expected = JSON.parse(readFileSync('packages/registry/dist/catalog.v1.json', 'utf8'));
          validatePublicCatalog(expected);
          const deadline = Date.now() + 180_000;
          let attempt = 0;
          let verified = false;
          let lastReason = 'No response received';
          while (Date.now() < deadline) {
            attempt += 1;
            const url = new URL('https://catalog.tampiloka.site/catalog.v1.json');
            url.searchParams.set('revision', process.env.GITHUB_SHA);
            url.searchParams.set('attempt', String(attempt));
            try {
              const response = await fetch(url, {
                cache: 'no-store', redirect: 'error',
                headers: { Accept: 'application/json', 'Cache-Control': 'no-cache' },
                signal: AbortSignal.timeout(Math.max(1, Math.min(15_000, deadline - Date.now()))),
              });
              if (!response.ok) throw new Error(`HTTP ${response.status}`);
              const live = await response.json();
              validatePublicCatalog(live);
              assert.deepEqual(live, expected, 'Live catalog does not match this commit');
              console.log('Exact published catalog verified:', live.entries.length, 'demos; attempt', attempt);
              verified = true;
              break;
            } catch (error) {
              lastReason = error.code === 'ERR_ASSERTION'
                ? 'Live JSON still differs from the generated artifact'
                : String(error.message ?? error).slice(0, 200);
              console.log(`Catalog verification attempt ${attempt}: ${lastReason}`);
            }
            const remaining = deadline - Date.now();
            if (remaining > 0) await delay(Math.min(5_000, remaining));
          }
          if (!verified) throw new Error(`Catalog did not match this commit within 180 seconds. Last result: ${lastReason}`);
          NODE
