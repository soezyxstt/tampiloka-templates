name: Publish public demo catalog

on:
  push:
    branches: [main]
    paths:
      - 'packages/registry/**'
      - 'scripts/build-public-catalog.mjs'
      - '.github/workflows/publish-catalog.yml'
  pull_request:
    paths:
      - 'packages/registry/**'
      - 'scripts/build-public-catalog.mjs'
      - '.github/workflows/publish-catalog.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: public-demo-catalog-${{ github.ref }}
  cancel-in-progress: false

jobs:
  catalog:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Validate publication boundaries and Worker response
        run: node --test packages/registry/tests/public-catalog.test.mjs
      - name: Build versioned public JSON and Worker
        run: |
          SOURCE_DATE_EPOCH=$(git show -s --format=%ct) node scripts/build-public-catalog.mjs
      - name: Keep the exact validated catalog
        uses: actions/upload-artifact@v7
        with:
          name: public-demo-catalog
          path: packages/registry/dist/catalog.v1.json
          retention-days: 14
      - name: Publish catalog independently of the marketing app
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npm exec --yes --package=wrangler@4.154.0 -- wrangler deploy --config packages/registry/wrangler.catalog.jsonc
      - name: Verify public feed
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: |
          curl --fail --silent --show-error --retry 8 --retry-delay 5 --retry-all-errors --header 'Cache-Control: no-cache' "https://catalog.tampiloka.site/catalog.v1.json?revision=${GITHUB_SHA}" --output /tmp/tampiloka-catalog-live.json
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          import assert from 'node:assert/strict';
          import { validatePublicCatalog } from './packages/registry/src/public-catalog.mjs';
          const expected = JSON.parse(readFileSync('packages/registry/dist/catalog.v1.json', 'utf8'));
          const live = JSON.parse(readFileSync('/tmp/tampiloka-catalog-live.json', 'utf8'));
          validatePublicCatalog(live);
          assert.deepEqual(live, expected, 'Live catalog does not match this commit');
          console.log('Exact published catalog verified:', live.entries.length, 'demos');
          NODE
