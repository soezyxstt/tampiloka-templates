name: Booking verified catalog release
on:
  push:
    branches: [feat/booking-template]
    paths: ['.github/booking-release.patch', '.github/workflows/booking-publication.yml']
permissions:
  contents: write
  actions: read
concurrency:
  group: booking-live-verification
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      WRANGLER_SEND_METRICS: 'false'
      BOOKING_CHECK_FILTER: 'Independent URL axes|Full customer booking|WhatsApp request|Owner content persistence|Role change'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/booking-template
      - name: Require complete local and live evidence before publication
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api repos/soezyxstt/tampiloka-templates/actions/runs/41156562018/jobs > /tmp/booking-gate.json
          gh run download 41156562018 --repo soezyxstt/tampiloka-templates --name booking-live-fixed --dir /tmp/booking-complete
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';import {readFileSync} from 'node:fs';
          const job=JSON.parse(readFileSync('/tmp/booking-gate.json')).jobs.find(j=>j.name==='verify');assert.equal(job.status,'completed');
          for(const name of ['Domain, CLI, registry, typecheck and independent clients','Browser on local Worker and real D1 SQL','Deploy isolated demo','Browser on deployed demo'])assert.equal(job.steps.find(s=>s.name===name)?.conclusion,'success',name);
          for(const folder of ['browser','local-browser']){const r=JSON.parse(readFileSync('/tmp/booking-complete/test-results/'+folder+'/report.json'));assert.equal(r.passed,46);assert.equal(r.failed,0);assert.ok(!r.fatal);assert.deepEqual(r.errors,[]);if(folder==='browser')assert.equal(r.base,'https://booking.tampiloka.site');}
          console.log('All full-suite checks passed. The prior standalone Python preview request received HTTP 403; this release verifies assets using the actual browser before publication.');
          JS
      - name: Apply release documentation and focused verification support
        run: |
          git apply --check .github/booking-release.patch
          git apply .github/booking-release.patch
      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.2
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Verify header deployment and affected workflows locally
        run: |
          pnpm lint:design
          pnpm typecheck
          pnpm --filter @tampiloka/template-booking test
          pnpm test:cli
          pnpm --filter @tampiloka/template-booking exec playwright install --with-deps chromium
          pnpm --filter @tampiloka/template-booking test:e2e
          cp -r templates/booking/test-results/browser templates/booking/test-results/header-local
      - name: Deploy isolated demo with static asset headers
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: '06d62d8a9335fed189a6a59fda0a4f48'
        run: pnpm --filter @tampiloka/template-booking deploy:demo
      - name: Verify affected live workflows with active CSP
        env:
          BOOKING_TEST_URL: https://booking.tampiloka.site
        run: |
          pnpm --filter @tampiloka/template-booking test:e2e
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';import {readFileSync} from 'node:fs';
          const r=JSON.parse(readFileSync('templates/booking/test-results/browser/report.json'));assert.equal(r.passed,5);assert.equal(r.failed,0);assert.ok(!r.fatal);assert.deepEqual(r.errors,[]);
          JS
      - name: Verify live preview images in the browser
        run: |
          pnpm --filter @tampiloka/template-booking exec node --input-type=module <<'JS'
          import assert from 'node:assert/strict';import {writeFile} from 'node:fs/promises';import {chromium} from 'playwright';
          const browser=await chromium.launch({headless:true});
          try{
            const page=await browser.newPage();await page.goto('https://booking.tampiloka.site/',{waitUntil:'networkidle',timeout:30000});
            const results=await page.evaluate(async()=>Promise.all(['medical','aesthetic','detailing','consulting'].map(async preset=>{const url=location.origin+'/demo-previews/booking-'+preset+'.webp';const r=await fetch(url);const image=await createImageBitmap(await r.blob());return {preset,url,status:r.status,contentType:r.headers.get('content-type'),dimensions:[image.width,image.height]};})));
            for(const image of results){assert.equal(image.status,200);assert.equal(image.contentType,'image/webp');assert.deepEqual(image.dimensions,[1280,800]);}
            await writeFile('test-results/live-previews.json',JSON.stringify({verifiedAt:new Date().toISOString(),previews:results},null,2));console.log(JSON.stringify(results,null,2));
          }finally{await browser.close();}
          JS
      - name: Enable canonical metadata only after the release gates pass
        run: |
          node --input-type=module <<'JS'
          import {readFile,writeFile} from 'node:fs/promises';import assert from 'node:assert/strict';
          const registryPath='packages/registry/templates.json',sourcePath='packages/registry/public-demos.json',modulePath='packages/registry/src/index.mjs';
          const registry=JSON.parse(await readFile(registryPath,'utf8')),source=JSON.parse(await readFile(sourcePath,'utf8'));const template=registry.templates.find(t=>t.id==='booking');
          template.demoUrl='https://booking.tampiloka.site';
          for(const [id,preset] of Object.entries(template.presets)){const url=new URL(template.demoUrl);url.searchParams.set('preset',id);url.searchParams.set('layout',preset.layout);url.searchParams.set('palette',preset.palette);url.searchParams.set('view','customer');preset.url=url.href;}
          let module=await readFile(modulePath,'utf8');const pattern=/export const bookingPresets = Object.freeze\(\{[\s\S]*?\n\}\);/;assert.ok(pattern.test(module));module=module.replace(pattern,'export const bookingPresets = Object.freeze('+JSON.stringify(template.presets,null,2)+');');
          const templatePattern=/  \{"id":"booking"[^\n]+/;assert.ok(templatePattern.test(module));module=module.replace(templatePattern,'  '+JSON.stringify({...template,presets:'BOOKING_PRESETS',levels:'BOOKING_LEVELS'}).replace('"BOOKING_PRESETS"','bookingPresets').replace('"BOOKING_LEVELS"','bookingLevels')+',');
          const family=source.families.find(f=>f.id==='booking');family.ready=true;for(const entry of family.entries){entry.ready=true;entry.imageUrl=template.demoUrl+'/demo-previews/booking-'+entry.preset+'.webp';}
          await writeFile(registryPath,JSON.stringify(registry,null,2)+'\n');await writeFile(sourcePath,JSON.stringify(source,null,2)+'\n');await writeFile(modulePath,module);
          const fullRun='https://github.com/soezyxstt/tampiloka-templates/actions/runs/41156562018';const releaseRun='https://github.com/'+process.env.GITHUB_REPOSITORY+'/actions/runs/'+process.env.GITHUB_RUN_ID;
          await writeFile('templates/booking/docs/verification.md',`# Recorded release verification\n\nDate: ${new Date().toISOString()}\n\nFull evidence: ${fullRun}\n\nHeader/catalog release evidence: ${releaseRun}\n\n## Completed checks\n\n- Booking domain/API/provider tests: 32 passed. Provider HTTP is mocked, not a merchant sandbox.\n- CLI tests: 15 passed, including all 16 preset/level combinations.\n- Registry tests: 11 passed. Public catalog tests: 5 passed.\n- Four fresh standalone projects passed installation, typecheck, build, doctor, migration and production-mode API checks.\n- Full real-Worker/D1 browser suite: 46 passed locally and 46 passed at https://booking.tampiloka.site, with no browser runtime exceptions.\n- After adding static asset security headers: 5 affected end-to-end checks passed locally and live under active CSP. The other checks were explicitly skipped in this focused rerun, not counted as passes.\n- 360, 390, 1024 and 1440 pixel layouts, reduced/normal staff motion, keyboard focus, URL axes/history, owner/viewer refresh, sample/reset isolation, payment retry, receipt, uploaded QR and check-in are covered.\n- All four public WebP preview URLs returned HTTP 200 in the browser and decoded to 1280x800 before enabling catalog readiness.\n- Booking typecheck/build, monorepo typecheck and design guard passed. Earlier affected cafe and commerce builds and commerce API tests passed in run 41153095810.\n\nThe full-suite workflow above has an overall failed status because its later standalone Python image request received HTTP 403. Its domain, standalone, local browser, deployment and live browser steps all succeeded. This release independently verifies all images using an actual browser; it does not count the failed Python request as a pass.\n\n## Boundaries\n\nNo real payment was processed. Client-owned secrets, merchant-specific Midtrans sandbox verification, physical camera testing, privacy/retention rules and backup recovery remain launch checks. See limitations.md and deployment.md. The branch and PR are not automatically merged. Public catalog publication from this reviewed branch requires merging the PR before future main-branch publications can retain these entries.\n`);
          JS
      - name: Validate all catalog modes and commit release metadata
        run: |
          pnpm test:registry
          pnpm catalog:test
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';import {readFileSync} from 'node:fs';import {buildPublicCatalog} from './packages/registry/src/public-catalog.mjs';
          const registry=JSON.parse(readFileSync('packages/registry/templates.json')),source=JSON.parse(readFileSync('packages/registry/public-demos.json'));const catalog=buildPublicCatalog(registry,source);const entries=catalog.entries.filter(e=>e.family==='booking');assert.equal(entries.length,4);
          for(const entry of entries){const url=new URL(entry.url);const preset=registry.templates.find(t=>t.id==='booking').presets[url.searchParams.get('preset')];assert.equal(url.searchParams.get('layout'),preset.layout);assert.equal(url.searchParams.get('palette'),preset.palette);assert.equal(url.searchParams.get('view'),'customer');assert.equal(Object.keys(entry.modeUrls).length,4);for(const [mode,href]of Object.entries(entry.modeUrls)){const m=new URL(href);assert.equal(m.searchParams.get('level'),mode);assert.equal(m.searchParams.get('preset'),url.searchParams.get('preset'));assert.equal(m.searchParams.get('layout'),preset.layout);}}
          console.log('Four booking previews and all sixteen mode URLs validated.');
          JS
          git rm .github/booking-release.patch .github/workflows/booking-publication.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add AGENTS.md templates/booking packages/registry
          git commit -m 'feat(booking): publish verified appointment demos and record release evidence'
          git push origin HEAD:refs/heads/feat/booking-template
      - name: Publish public catalog without changing the marketing app
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: '06d62d8a9335fed189a6a59fda0a4f48'
        run: |
          git fetch origin main
          test "$(git rev-parse origin/main)" = 4e39002c39326bc00a85e2039fa13c303e1992da
          SOURCE_DATE_EPOCH=$(git show -s --format=%ct) node scripts/build-public-catalog.mjs
          pnpm --filter @tampiloka/template-booking exec wrangler deploy --config ../../packages/registry/wrangler.catalog.jsonc
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';import {readFileSync,writeFileSync} from 'node:fs';
          const expected=JSON.parse(readFileSync('packages/registry/dist/catalog.v1.json'));let verified=false;
          for(let attempt=0;attempt<20;attempt++){try{const r=await fetch('https://catalog.tampiloka.site/catalog.v1.json?booking='+Date.now(),{signal:AbortSignal.timeout(15000),cache:'no-store'});assert.equal(r.status,200);assert.deepEqual(await r.json(),expected);verified=true;break;}catch(e){if(attempt===19)throw e;await new Promise(r=>setTimeout(r,3000));}}
          assert.equal(verified,true);writeFileSync('templates/booking/test-results/published-catalog.json',JSON.stringify({verifiedAt:new Date().toISOString(),entries:expected.entries.length,families:expected.families.length,booking:expected.entries.filter(e=>e.family==='booking')},null,2));
          JS
      - name: Preserve release evidence
        if: always()
        run: |
          mkdir -p /tmp/booking-delivered
          git archive --format=tar.gz HEAD -o /tmp/booking-delivered/source.tar.gz
          cp -r templates/booking/test-results /tmp/booking-delivered/ 2>/dev/null || true
          cp -r /tmp/booking-complete/test-results /tmp/booking-delivered/full-verification 2>/dev/null || true
          cp -r templates/booking/public/demo-previews /tmp/booking-delivered/ 2>/dev/null || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: booking-delivery
          path: /tmp/booking-delivered
          retention-days: 7
