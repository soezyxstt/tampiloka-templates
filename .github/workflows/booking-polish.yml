name: Booking final polish verification
on:
  push:
    branches: [feat/booking-template]
    paths: ['.github/booking-final-polish.patch', '.github/workflows/booking-polish.yml']
permissions:
  contents: write
concurrency:
  group: booking-live-verification
  cancel-in-progress: false
jobs:
  finish:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/booking-template
      - name: Apply final reviewed layout patch
        run: |
          git apply --check .github/booking-final-polish.patch
          git apply .github/booking-final-polish.patch
          git rm .github/booking-final-polish.patch .github/workflows/booking-polish.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add AGENTS.md docs/architecture.md templates/booking
          git commit -m 'fix(booking): keep native time values readable on small screens'
          git push origin HEAD:refs/heads/feat/booking-template
      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.2
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Verify CLI, domain and builds
        run: |
          mkdir -p templates/booking/test-results/regression
          set -o pipefail
          pnpm lint:design | tee templates/booking/test-results/regression/design.log
          pnpm test:cli | tee templates/booking/test-results/regression/cli.log
          pnpm test:registry | tee templates/booking/test-results/regression/registry.log
          pnpm catalog:test | tee templates/booking/test-results/regression/catalog.log
          pnpm typecheck | tee templates/booking/test-results/regression/typecheck.log
          pnpm --filter @tampiloka/template-booking test | tee templates/booking/test-results/regression/booking.log
          pnpm --filter @tampiloka/template-booking build | tee templates/booking/test-results/regression/build.log
          pnpm test:booking:standalone
      - name: Real Worker and D1 browser regression
        run: |
          pnpm --filter @tampiloka/template-booking exec playwright install --with-deps chromium
          pnpm --filter @tampiloka/template-booking test:e2e
          cp -r templates/booking/test-results/browser templates/booking/test-results/local-browser
      - name: Release isolated demo only
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: '06d62d8a9335fed189a6a59fda0a4f48'
        run: pnpm --filter @tampiloka/template-booking deploy:demo
      - name: Verify real deployed workflows
        env:
          BOOKING_TEST_URL: https://booking.tampiloka.site
        run: pnpm --filter @tampiloka/template-booking test:e2e
      - name: Collect exact source and evidence
        if: always()
        run: |
          mkdir -p /tmp/booking-final
          git archive --format=tar.gz HEAD -o /tmp/booking-final/source.tar.gz
          cp -r templates/booking/test-results /tmp/booking-final/ 2>/dev/null || true
          cp -r templates/booking/public/demo-previews /tmp/booking-final/ 2>/dev/null || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: booking-final-delivery
          path: /tmp/booking-final
          retention-days: 7
