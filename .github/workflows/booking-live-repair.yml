name: Booking live latency repair
on:
  push:
    branches: [feat/booking-template]
    paths: ['.github/booking-live-fixes.patch', '.github/workflows/booking-live-repair.yml']
permissions:
  contents: write
concurrency:
  group: booking-live-verification
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/booking-template
      - name: Apply reviewed live latency fixes
        run: |
          git apply --check .github/booking-live-fixes.patch
          git apply .github/booking-live-fixes.patch
          git rm .github/booking-live-fixes.patch .github/workflows/booking-live-repair.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add templates/booking/src/pages/Staff.tsx templates/booking/tests
          git commit -m 'fix(booking): hide stale staff authority during role refresh and await live mutations'
          git push origin HEAD:refs/heads/feat/booking-template
      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.2
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Domain, CLI, registry, typecheck and independent clients
        run: |
          mkdir -p templates/booking/test-results/regression
          set -o pipefail
          pnpm lint:design | tee templates/booking/test-results/regression/design.log
          pnpm test:cli | tee templates/booking/test-results/regression/cli.log
          pnpm test:registry | tee templates/booking/test-results/regression/registry.log
          pnpm catalog:test | tee templates/booking/test-results/regression/catalog.log
          pnpm typecheck | tee templates/booking/test-results/regression/typecheck.log
          pnpm --filter @tampiloka/template-booking test | tee templates/booking/test-results/regression/booking.log
          pnpm --filter @tampiloka/template-booking build | tee templates/booking/test-results/regression/build.log
          pnpm test:booking:standalone
      - name: Browser on local Worker and real D1 SQL
        run: |
          pnpm --filter @tampiloka/template-booking exec playwright install --with-deps chromium
          pnpm --filter @tampiloka/template-booking test:e2e
          cp -r templates/booking/test-results/browser templates/booking/test-results/local-browser
      - name: Deploy isolated demo
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: '06d62d8a9335fed189a6a59fda0a4f48'
        run: pnpm --filter @tampiloka/template-booking deploy:demo
      - name: Browser on deployed demo
        env:
          BOOKING_TEST_URL: https://booking.tampiloka.site
        run: pnpm --filter @tampiloka/template-booking test:e2e
      - name: Verify public preview assets
        run: |
          python3 -m pip install Pillow
          python3 - <<'PY'
          import json,datetime,pathlib
          from urllib.request import urlopen
          from PIL import Image
          from io import BytesIO
          result=[]
          for preset in ['medical','aesthetic','detailing','consulting']:
              url='https://booking.tampiloka.site/demo-previews/booking-'+preset+'.webp'
              response=urlopen(url,timeout=20); image=Image.open(BytesIO(response.read())); assert image.size==(1280,800)
              result.append({'url':url,'status':response.status,'dimensions':list(image.size)})
          pathlib.Path('templates/booking/test-results/live-previews.json').write_text(json.dumps({'verifiedAt':datetime.datetime.now(datetime.timezone.utc).isoformat(),'previews':result},indent=2))
          PY
      - name: Preserve exact source and evidence
        if: always()
        run: |
          mkdir -p /tmp/booking-live-fixed
          git archive --format=tar.gz HEAD -o /tmp/booking-live-fixed/source.tar.gz
          cp -r templates/booking/test-results /tmp/booking-live-fixed/ 2>/dev/null || true
          cp -r templates/booking/public/demo-previews /tmp/booking-live-fixed/ 2>/dev/null || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: booking-live-fixed
          path: /tmp/booking-live-fixed
          retention-days: 7
