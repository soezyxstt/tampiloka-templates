name: Booking final workspace review
on:
  push:
    branches: [feat/booking-template]
    paths: ['.github/booking-workspace.patch', '.github/workflows/booking-workspace-review.yml']
permissions:
  contents: write
jobs:
  review:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/booking-template
      - name: Apply reviewed schedule layout and browser coverage
        run: |
          git apply --check .github/booking-workspace.patch
          git apply .github/booking-workspace.patch
          git rm .github/booking-workspace.patch .github/workflows/booking-workspace-review.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add templates/booking/src/styles/staff.css templates/booking/tests/browser.mjs
          git commit -m 'fix(booking): align responsive schedule controls and verify every staff viewport'
          git push origin HEAD:refs/heads/feat/booking-template
      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.2
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Verify source and standalone clients
        run: |
          mkdir -p templates/booking/test-results/regression
          set -o pipefail
          pnpm lint:design | tee templates/booking/test-results/regression/design.log
          pnpm test:cli | tee templates/booking/test-results/regression/cli.log
          pnpm test:registry | tee templates/booking/test-results/regression/registry.log
          pnpm catalog:test | tee templates/booking/test-results/regression/catalog.log
          pnpm typecheck | tee templates/booking/test-results/regression/typecheck.log
          pnpm --filter @tampiloka/template-booking test | tee templates/booking/test-results/regression/booking-test.log
          pnpm --filter @tampiloka/template-booking build | tee templates/booking/test-results/regression/booking-build.log
          pnpm test:booking:standalone
      - name: Browser checks on real Worker and local D1
        run: |
          pnpm --filter @tampiloka/template-booking exec playwright install --with-deps chromium
          pnpm --filter @tampiloka/template-booking test:e2e
          cp -r templates/booking/test-results/browser templates/booking/test-results/local-browser
      - name: Deploy isolated demo with pre-applied migration
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: '06d62d8a9335fed189a6a59fda0a4f48'
        run: |
          # 0001_booking.sql was applied through the authorized Cloudflare connector.
          # This one-time release never migrates or writes a client production database.
          pnpm --filter @tampiloka/template-booking deploy:demo
      - name: Verify deployed workflows and previews
        env:
          BOOKING_TEST_URL: https://booking.tampiloka.site
        run: |
          pnpm --filter @tampiloka/template-booking test:e2e
          python3 -m pip install Pillow
          python3 - <<'PY'
          import json,datetime,pathlib
          from urllib.request import urlopen
          from PIL import Image
          from io import BytesIO
          results=[]
          for preset in ['medical','aesthetic','detailing','consulting']:
              url='https://booking.tampiloka.site/demo-previews/booking-'+preset+'.webp'
              r=urlopen(url,timeout=20); image=Image.open(BytesIO(r.read())); assert image.size==(1280,800)
              results.append({'url':url,'status':r.status,'dimensions':list(image.size)})
          pathlib.Path('templates/booking/test-results/live-previews.json').write_text(json.dumps({'verifiedAt':datetime.datetime.now(datetime.timezone.utc).isoformat(),'previews':results},indent=2))
          PY
      - name: Collect evidence
        if: always()
        run: |
          mkdir -p /tmp/booking-reviewed
          git archive --format=tar.gz HEAD -o /tmp/booking-reviewed/source.tar.gz
          cp -r templates/booking/test-results /tmp/booking-reviewed/ 2>/dev/null || true
          cp -r templates/booking/public/demo-previews /tmp/booking-reviewed/ 2>/dev/null || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: booking-reviewed
          path: /tmp/booking-reviewed
          retention-days: 7
