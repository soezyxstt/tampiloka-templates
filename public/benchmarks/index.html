<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Benchmark Millehub</title>
  <style>
    :root { color-scheme: light; font-family: system-ui, sans-serif; color: #202523; background: #f6f7f5; }
    body { max-width: 1440px; margin: auto; padding: 32px 24px; }
    h1 { margin: 0 0 10px; font-size: 28px; }
    p { line-height: 1.6; }
    #summary { max-width: 900px; white-space: pre-line; }
    #notice { padding: 16px; background: #fff; border: 1px solid #dce1dc; border-radius: 10px; }
    #gallery { display: grid; grid-template-columns: repeat(auto-fill, minmax(270px, 1fr)); gap: 20px; margin-top: 24px; }
    figure { margin: 0; overflow: hidden; background: #fff; border: 1px solid #dce1dc; border-radius: 12px; }
    figure > a { display: block; background: #e9ece8; }
    img { display: block; width: 100%; height: 320px; object-fit: contain; }
    figcaption { padding: 16px; }
    h2 { font-size: 17px; margin: 0 0 8px; }
    .state { font-size: 14px; margin: 8px 0; color: #4b5550; white-space: pre-line; }
    .status { display: inline-block; font-size: 12px; padding: 4px 8px; border-radius: 5px; background: #eef1ed; }
    .filename { display: block; overflow-wrap: anywhere; font-size: 12px; margin-top: 12px; color: #4b5550; }
    footer { margin-top: 30px; color: #59635d; font-size: 13px; }
  </style>
</head>
<body>
  <header>
    <h1>Benchmark Millehub</h1>
    <p id="summary">Memuat catatan benchmark…</p>
    <p id="notice" role="status">Memuat daftar screenshot dari manifest.json…</p>
  </header>
  <main id="gallery" aria-label="Galeri screenshot benchmark"></main>
  <footer>Screenshot dan status cakupan ditampilkan sesuai manifest. Buka gambar untuk melihat ukuran aslinya.</footer>
  <script>
    const summary = document.querySelector('#summary');
    const notice = document.querySelector('#notice');
    const gallery = document.querySelector('#gallery');
    function localImagePath(value) {
      if (typeof value !== 'string' || !value || /^(?:[a-z]+:|\/|\\)/i.test(value)) return null;
      const parts = value.split(/[\\/]/);
      if (parts.some(part => part === '..' || part === '.')) return null;
      return parts.map(encodeURIComponent).join('/');
    }
    async function load() {
      try {
        const response = await fetch('./manifest.json', { cache: 'no-store' });
        if (!response.ok) throw new Error('Manifest belum tersedia.');
        const manifest = await response.json();
        summary.textContent = typeof manifest.summary === 'string'
          ? manifest.summary
          : 'Dokumentasi interaksi situs Millehub beserta status cakupan tiap screenshot.';
        const screenshots = Array.isArray(manifest.screenshots) ? manifest.screenshots : [];
        let count = 0;
        for (const item of screenshots) {
          const path = localImagePath(item.file);
          if (!path) continue;
          const figure = document.createElement('figure');
          const link = document.createElement('a');
          link.href = path;
          link.target = '_blank';
          link.rel = 'noopener';
          const image = document.createElement('img');
          image.src = path;
          image.alt = item.title || item.file;
          image.loading = 'lazy';
          link.append(image);
          const caption = document.createElement('figcaption');
          const title = document.createElement('h2');
          title.textContent = item.title || item.file;
          const status = document.createElement('span');
          status.className = 'status';
          status.textContent = item.status || 'Status belum dicatat';
          const state = document.createElement('p');
          state.className = 'state';
          state.textContent = item.state || '';
          const filename = document.createElement('a');
          filename.className = 'filename';
          filename.href = path;
          filename.textContent = item.file;
          caption.append(title, status, state, filename);
          figure.append(link, caption);
          gallery.append(figure);
          count++;
        }
        notice.textContent = count
          ? `${count} screenshot tercatat. Lihat label status untuk cakupan masing-masing keadaan.`
          : 'Belum ada screenshot yang tercatat dalam manifest.';
      } catch (error) {
        summary.textContent = 'Galeri menunggu hasil pengambilan screenshot.';
        notice.textContent = 'Daftar screenshot belum dapat dimuat. Sajikan folder ini melalui server HTTP dan pastikan manifest.json tersedia.';
      }
    }
    load();
  </script>
</body>
</html>
